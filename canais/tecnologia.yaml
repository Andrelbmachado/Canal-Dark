id: tecnologia
nome: "Tecnologia Hoje"

# Captação
intervalo_captacao_min: 30
captar_por_dia: 20
estoque_max: 60            # a captação pausa com 60 vídeos esperando no Drive

# Fontes do canal (também dá para editar na aba Captação)
fontes:
  - tipo: youtube_canal
    url: https://www.youtube.com/@AlmanaqueSOS   # canal provisório, mude na aba Captação
    tom: serio
    autorizado: false
  - tipo: youtube_busca
    busca: "tecnologia IA celular"
    tom: serio
  - tipo: youtube_busca
    busca: "meme tecnologia"
    tom: meme

palavras_chave: [IA, inteligência artificial, ChatGPT, iPhone, Samsung, Android, Apple, Google, celular]

# Edição: chance de cada estilo, por tom da fonte (cada tabela soma 1.0)
estilos:
  serio: {faixa_cima: 0.5, faixa_dupla: 0.3, karaoke: 0.2}
  meme: {comentario: 0.4, meme_shrek: 0.3, meme_dicaprio: 0.3}
manchete_padrao: ["Olha essa tecnologia", "Você sabia disso?", "Isso vai mudar tudo"]
texto_base: "Siga para mais tecnologia"
revisar_antes_de_publicar: false

# Publicação
horarios: ["08:00", "11:30", "18:30", "21:30"]
max_por_dia: 4
contas: {youtube: tecnologia, instagram: tecnologia, facebook: tecnologia, tiktok: tecnologia}
hashtags: ["#tecnologia", "#ia", "#tech"]
tiktok_modo: rascunho      # troque para publicar depois que o app do TikTok passar na auditoria
# cookies_navegador: chrome   # use se o YouTube pedir para confirmar que não é um robô
